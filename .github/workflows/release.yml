name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag is the release train's label, not a version to stamp: the packages sit on
  # independent native version lines (RTC 4.6.x, RTM 2.2.x) and each publishes at its own pin
  # from Directory.Build.props. Republishing a package whose pin did not move is a no-op — the
  # push below uses --skip-duplicate.
  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      # The sample is a compile check on the public API, and the commit being tagged has already
      # been through it on its pull request. Building it again here would put a MAUI workload
      # install between the package being built and being published, for a result already known.
      build-sample: false

  publish:
    name: publish to nuget.org and create release
    needs: [build]
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Compose release notes
        run: |
          . ./build/pins.sh
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # A curated docs/release-notes/<tag>.md replaces the generated commit list when one
          # exists (tags are the train label, e.g. v4.6.3.2 for an RTC-led train).
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"

          {
            if [ -f "${notes}" ]; then
              echo "==> using curated notes from ${notes}" >&2
              cat "${notes}"
            else
              echo "## What's changed"
              echo
              if [ -n "${previous}" ]; then
                git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
              else
                # No previous tag: listing every commit would reach back to the repository's first
                # commit, which is noise rather than a changelog.
                echo "Initial release."
              fi
            fi
            echo
            if [ -n "${previous}" ]; then
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${GITHUB_REF_NAME}"
              echo
            fi
            echo "## Packages"
            echo
            echo "Bound against io.agora.rtc:full-rtc-basic \`${AGORA_VIDEO_VERSION}\`, io.agora.rtc:voice-rtc-basic \`${AGORA_VOICE_VERSION}\`, io.agora:agora-rtm \`${AGORA_SIGNALING_VERSION}\`, io.agora.rtc:chat-sdk \`${AGORA_CHAT_VERSION}\` io.agora:iotsdk \`${AGORA_IOT_VERSION}\` (Maven Central), and netless-io's whiteboard-android \`${AGORA_WHITEBOARD_VERSION}\` and fastboard-android \`${AGORA_FASTBOARD_VERSION}\` (JitPack). Each package publishes at its own version line; a row whose version did not move since the previous train was skipped by the push, not republished."
            echo
            echo "| Package | NuGet |"
            echo "| --- | --- |"
            echo "| \`Net.Agora.Video.Android\` | [${AGORA_VIDEO_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Video.Android/${AGORA_VIDEO_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Voice.Android\` | [${AGORA_VOICE_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Voice.Android/${AGORA_VOICE_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Signaling.Android\` | [${AGORA_SIGNALING_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Signaling.Android/${AGORA_SIGNALING_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Chat.Android\` | [${AGORA_CHAT_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Chat.Android/${AGORA_CHAT_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Whiteboard.Android\` | [${AGORA_WHITEBOARD_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Whiteboard.Android/${AGORA_WHITEBOARD_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Fastboard.Android\` | [${AGORA_FASTBOARD_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.Fastboard.Android/${AGORA_FASTBOARD_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.IoT.Android\` | [${AGORA_IOT_PACKAGE_VERSION}](https://www.nuget.org/packages/Net.Agora.IoT.Android/${AGORA_IOT_PACKAGE_VERSION}) |"
            echo "| \`Net.Agora.Extensions.*.Android\` (12) | [${AGORA_VIDEO_PACKAGE_VERSION}](https://www.nuget.org/packages?q=Net.Agora.Extensions) |"
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md

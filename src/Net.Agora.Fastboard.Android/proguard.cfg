# fastboard-android's own proguard.txt (which the app build picks up from the aar) keeps only
# io.agora.board.fast.{,extension,model,ui} — enough for Java consumers, but the binding also
# reaches other types over JNI where R8 sees no references, so keep the whole namespace. The
# com.herewhite / wendu.dsbridge rules travel with Net.Agora.Whiteboard.Android, which this
# package depends on.
-keep class io.agora.board.fast.** { *; }
-dontwarn io.agora.board.fast.**

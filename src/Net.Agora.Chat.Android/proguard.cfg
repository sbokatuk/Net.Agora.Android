# chat-sdk ships no proguard.txt of its own (verified against 1.4.0; its res/raw/keep.xml is an
# aapt resource keep, not a code rule). The .NET Android build auto-keeps the bound surface;
# this covers what it cannot see — unbound classes the SDK reaches reflectively. Same blanket
# rule Agora ships inside the RTC aars and documents for Chat — see src/Agora.Proguard.targets.
-keep class io.agora.** { *; }
-dontwarn io.agora.**

# iotsdk's own proguard.txt is empty (verified against 1.3.0). This package is the strongest
# case for blanket keeps: the binding deliberately unbinds the private RTC/RTM copies the aar
# bundles (Transforms/Metadata.xml removes 23 packages), so the auto-generated bound-surface
# keeps do not cover them — yet io.agora.iotlink drives them at runtime, partly reflectively,
# where R8 sees no reference. Same rule Agora ships inside the RTC aars.
-keep class io.agora.** { *; }
-dontwarn io.agora.**

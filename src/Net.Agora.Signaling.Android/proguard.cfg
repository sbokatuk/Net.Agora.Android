# agora-rtm ships no proguard.txt of its own (verified against 2.2.6). The .NET Android build
# auto-keeps the bound surface, so this is defense-in-depth for what that cannot see: classes
# the binding does not bind but the SDK reaches reflectively. Same blanket rule Agora ships
# inside the RTC aars — see src/Agora.Proguard.targets for the full reasoning.
-keep class io.agora.** { *; }
-dontwarn io.agora.**

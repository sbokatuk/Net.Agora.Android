# whiteboard-android ships no proguard.txt (verified against 2.16.124), and the binding reaches
# com.herewhite over JNI where R8 sees no references.
-keep class com.herewhite.** { *; }
-dontwarn com.herewhite.**

# DSBridge is bound too (WhiteboardView extends wendu.dsbridge.special.DWebView) and also ships
# no rules. Its JS<->Java bridge is invoked reflectively from JavaScript, so both the classes
# and the @JavascriptInterface members must survive by name.
-keep class wendu.dsbridge.** { *; }
-dontwarn wendu.dsbridge.**
-keepattributes JavascriptInterface
-keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
